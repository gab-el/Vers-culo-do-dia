<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versículo do dia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon_io/favicon-16x16.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <header class="header">
            <h1>Versículo do dia</h1>
        </header>
      
        <section class="card-versiculo">
            <div class="container-texto">
                <p id="texto-versiculo">Carregando versículo...</p>
                <button id="btn-copiar" class="btn-copiar" title="Copiar para a área de transferência">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                </button>
            </div>
            <span id="referencia-versiculo">Aguarde...</span>
            <button id="btn-novo-versiculo">Outro Versículo</button>
        </section>

        <div class="player-spotify-lateral">
    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/7nY9dR6oLLMZGrojOzhsL5?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>
        </div>

        <footer class="footer">
            <p>© 2026 Meu Projeto Bíblico | Desenvolvido com carinho.</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
